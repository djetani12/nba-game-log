<!DOCTYPE html>
<html>
<head>
    <title>NBA Game Logs</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: black;
            color: white;
            padding: 12px 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        input, select, button {
            padding: 8px;
            margin-right: 10px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background-color: white;
        }

        th {
            position: sticky;
            top: 0;
            background-color: #111;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        td {
            padding: 8px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

<div class="navbar">
    NBA Game Logs
    <span style="float:right; font-size:14px; cursor:pointer;" onclick="goHome()">Home</span>
</div>

<div class="container">

    <input type="text" id="playerInput" placeholder="Enter player name">
    
    <select id="seasonSelect">
        <option value="2025-26">2025-26</option>
        <option value="2024-25">2024-25</option>
        <option value="2023-24">2023-24</option>
    </select>

    <button onclick="searchPlayer()">Search</button>

    <table id="statsTable">
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script>

let currentData = [];
let sortState = {};

function goHome() {
    window.location.href = "/";
}

function searchPlayer() {
    const name = document.getElementById("playerInput").value;
    const season = document.getElementById("seasonSelect").value;

    // Update URL
    const url = `/?player=${encodeURIComponent(name)}&season=${season}`;
    window.history.pushState({}, '', url);

    fetch(`/search?name=${name}&season=${season}`)
        .then(res => res.json())
        .then(data => {
            currentData = data;
            renderTable(data);
        });
}

function renderTable(data) {
    const header = document.getElementById("tableHeader");
    const body = document.querySelector("#statsTable tbody");

    header.innerHTML = "";
    body.innerHTML = "";

    if (data.length === 0) return;

    const columns = Object.keys(data[0]);

    columns.forEach(col => {
        const th = document.createElement("th");
        th.innerText = col;
        th.onclick = () => sortTable(col);
        header.appendChild(th);
    });

    data.forEach(row => {
        const tr = document.createElement("tr");

        columns.forEach(col => {
            const td = document.createElement("td");
            td.innerText = row[col];
            tr.appendChild(td);
        });

        body.appendChild(tr);
    });
}

function sortTable(column) {
    sortState[column] = !sortState[column];

    currentData.sort((a, b) => {

        if (column === "Date") {
            const d1 = new Date(a[column]);
            const d2 = new Date(b[column]);
            return sortState[column] ? d1 - d2 : d2 - d1;
        }

        let valA = a[column];
        let valB = b[column];

        if (!isNaN(valA)) {
            valA = Number(valA);
            valB = Number(valB);
        }

        if (valA < valB) return sortState[column] ? -1 : 1;
        if (valA > valB) return sortState[column] ? 1 : -1;
        return 0;
    });

    renderTable(currentData);
}


// Load from URL if exists
window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    const player = params.get("player");
    const season = params.get("season");

    if (player) {
        document.getElementById("playerInput").value = player;
        if (season) document.getElementById("seasonSelect").value = season;

        fetch(`/search?name=${player}&season=${season}`)
            .then(res => res.json())
            .then(data => {
                currentData = data;
                renderTable(data);
            });
    }
};

</script>

</body>
</html>
